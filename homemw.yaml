background:
  type: random
showApps: true
showWeather: true
city: San Angelo, Texas
clock:
  enabled: true
  use24HourTime: true
  showSeconds: true
apps:
  - name: Github
    url: https://github.com
    icon:
      library: simple-icons
      id: github
shortcuts:
  - key: g
    name: Google
    searchUrl: https://www.google.com/search?q=
    icon:
      library: simple-icons
      id: google
  - key: gh
    name: GitHub
    searchUrl: https://github.com/search?q=
    icon:
      library: lucide
      id: Sparkle
  - key: yt
    name: YouTube
    searchUrl: https://www.youtube.com/results?search_query=
    icon:
      library: lucide
      id: Sparkle
  - key: gm
    name: Google Maps
    searchUrl: https://www.google.com/maps/search/?api=1&query=
    icon:
      library: lucide
      id: Sparkle
  - key: npm
    name: npm
    searchUrl: https://www.npmjs.com/search?q=
    icon:
      library: lucide
      id: Sparkle
  - key: mdn
    name: MDN Web Docs
    searchUrl: https://developer.mozilla.org/en-US/search?q=
    icon:
      library: lucide
      id: Sparkle
  - key: so
    name: Stack Overflow
    searchUrl: https://stackoverflow.com/search?q=
    icon:
      library: lucide
      id: Sparkle
  - key: reddit
    name: Reddit
    searchUrl: https://www.reddit.com/search/?q=
    icon:
      library: lucide
      id: Sparkle
  - key: wiki
    name: Wikipedia
    searchUrl: https://en.wikipedia.org/w/index.php?search=
    icon:
      library: lucide
      id: Sparkle
  - key: imdb
    name: IMDb
    searchUrl: https://www.imdb.com/find/?q=
    icon:
      library: lucide
      id: Sparkle
  - key: gpt
    name: ChatGPT
    searchUrl: https://chatgpt.com/?q=
    icon:
      library: lucide
      id: Sparkle
